<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>善鸡通搜索</title>
<style>
:root{color-scheme:dark;--bg:#0b1010;--panel:#121b19;--line:#2c3c34;--accent:#c7f36b;--muted:#a3b1a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2b20,#0b1010 60%);color:#eef5e8;font:16px system-ui,-apple-system,"Noto Sans SC",sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:34px 18px 60px}.brand{color:var(--accent);font-size:13px;letter-spacing:.18em;text-transform:uppercase}.hero{margin:28px 0 22px}.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.1;margin:0 0 12px}.hero p,.muted{color:var(--muted)}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:180px}.panel{border:1px solid var(--line);background:#101815e8;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 14px 50px #0002}input,textarea{background:#0b1210;color:#eef5e8;border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit;width:100%}textarea{min-height:90px;resize:vertical}button{background:var(--accent);border:0;border-radius:10px;padding:12px 17px;font-weight:750;color:#17200d;cursor:pointer}button.secondary{background:#26362b;color:#e6f4d8;border:1px solid var(--line)}.result{padding:14px 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}.result a{color:var(--accent);font-weight:700;text-decoration:none}.result p{color:#c5d1c6;margin:8px 0}.tag{font-size:12px;color:var(--muted)}details summary{cursor:pointer;color:var(--accent);font-weight:700}form{display:grid;gap:10px;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:14px;color:var(--muted);white-space:pre-wrap}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:24px 14px}}
</style></head><body><main class="wrap"><div class="brand">SHANJITONG · SEARCH</div><section class="hero"><h1>善鸡通搜索</h1><p>轻量级网页内容索引与关键词检索。先搜索示例内容，再添加你自己的网页资料。</p></section>
<section class="panel"><form id="searchForm"><div class="search"><input id="q" placeholder="试试：善鸡通、搜索服务" maxlength="200" required><button>搜索</button></div></form><div id="status" class="status" style="margin-top:12px">正在连接搜索服务…</div><div id="results"></div></section>
<section class="panel"><details><summary>管理员：添加网页到搜索索引</summary><p class="muted">在 Render 服务的 Environment 页面查看 ADMIN_API_KEY，并粘贴到下面。添加的是你提供的网页标题和正文；本版本不会自动爬取外部网站。</p><form id="addForm"><input id="key" type="password" placeholder="ADMIN_API_KEY（管理员密钥）" autocomplete="off" required><input id="url" type="url" placeholder="网页 URL，例如 https://example.com/article" required><input id="title" placeholder="网页标题" maxlength="300" required><textarea id="description" placeholder="摘要（可选）" maxlength="3000"></textarea><textarea id="text" placeholder="网页正文或需要检索的内容" maxlength="100000" required></textarea><button>添加到索引</button><div id="addStatus" class="status"></div></form></details></section>
<footer class="muted">API：<code>/health</code> · <code>/api/search?q=关键词</code></footer></main>
<script>
const $=id=>document.getElementById(id);const status=$('status');
async function search(q){status.textContent='正在搜索…';$('results').innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw new Error(d.error||'搜索失败');status.textContent=`找到 ${d.count} 条结果`;if(!d.count){$('results').innerHTML='<p class="muted">没有匹配结果。你可以添加网页内容后再试。</p>';return}for(const x of d.results){const div=document.createElement('article');div.className='result';const a=document.createElement('a');a.textContent=x.title;a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';const p=document.createElement('p');p.textContent=x.snippet||x.description||'';const tag=document.createElement('div');tag.className='tag';tag.textContent=`相关度 ${x.score} · ${x.url}`;div.append(a,p,tag);$('results').append(div)}}catch(e){status.textContent='连接失败：'+e.message}}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('q').value.trim())});
$('addForm').addEventListener('submit',async e=>{e.preventDefault();$('addStatus').textContent='正在提交…';try{const r=await fetch('/api/pages',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('key').value},body:JSON.stringify({url:$('url').value.trim(),title:$('title').value.trim(),description:$('description').value.trim(),text:$('text').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'提交失败');$('addStatus').textContent='添加成功，可以立即搜索。';$('addForm').reset();if($('q').value.trim())search($('q').value.trim())}catch(e){$('addStatus').textContent='添加失败：'+e.message}});
fetch('/health').then(r=>r.json()).then(d=>{status.textContent=d.ok?'服务已连接。可直接搜索示例内容。':'服务状态异常';search('善鸡通')}).catch(()=>status.textContent='无法连接后端，请检查 Render 部署日志。');
</script></body></html>
